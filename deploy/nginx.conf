# 时光集生产环境 Nginx 配置（同域反代，spec §3 / §10）
#
# 用法：
#   1. 替换 <domain> 为站点域名、证书路径为实际路径（Let's Encrypt 示例）
#   2. 站点根目录 /var/www/blog：dist/（前端构建产物）、uploads/（用户上传）
#   3. ln -s /var/www/blog/deploy/nginx.conf /etc/nginx/sites-available/blog && ln -s ../sites-available/blog /etc/nginx/sites-enabled/
#      （CentOS 无 sites-* 时直接 include 到 http{} 或放 /etc/nginx/conf.d/blog.conf）
#
# 流量分工：
#   /api/*   → 反代 Go :8080（JWT cookie Path=/api，同域无跨站问题）
#   /post/*  → 反代 Go :8080（SEO meta 注入由后端完成，见 internal/router/spa.go）
#   /uploads → Nginx 直出，禁止任何脚本执行
#   其余     → Nginx 直出 dist（SPA history 路由 fallback 到 index.html）

# 80 端口只做跳转（ACME 续期走 webroot，如用 DNS 验证可去掉该 location）
server {
    listen 80;
    server_name <domain>;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name <domain>;

    ssl_certificate     /etc/letsencrypt/live/<domain>/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/<domain>/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # 上传接口 5MB 上限 + 表单开销（后端同样校验，双保险）
    client_max_body_size 6m;

    # ---------- 安全响应头 ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    # 如需 CSP，注意 md-editor-v3/Shiki 会注入 inline style，样式需放行 'unsafe-inline'
    # add_header Content-Security-Policy "default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-src player.bilibili.com www.youtube.com www.youtube-nocookie.com player.youku.com" always;

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /var/www/blog/dist;
    index index.html;

    # ---------- API 与 SEO 注入页：反代 Go ----------
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /post/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- 用户上传：直出 + 禁执行（魔数白名单已在上传时校验，此处兜底） ----------
    # 注意：nginx 规定 location 内一旦出现自己的 add_header，server 级安全头即不再继承，
    # 因此下面凡带 Cache-Control 的 location 都重复声明了四个安全头。
    location ^~ /uploads/ {
        alias /var/www/blog/uploads/;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800";
        location ~* ^/uploads/.*\.(php|phtml|phar|pl|py|cgi|sh|asp|aspx|jsp)$ {
            deny all;
        }
    }

    # ---------- 前端静态资源 ----------
    # Vite 带内容哈希的资源，长缓存（不用 expires，避免叠加出两个 Cache-Control 头）
    location /assets/ {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    # index.html 禁缓存，保证发版即时生效
    location = /index.html {
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header X-Frame-Options           "SAMEORIGIN" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }
    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;
}
