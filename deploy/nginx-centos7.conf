# 时光集 Nginx 配置 — CentOS 7 适配版（el7 源 nginx 1.12/1.20 + OpenSSL 1.0.2k）
#
# 与 deploy/nginx.conf 的差异：
#   1. `http2 on;`（nginx ≥1.25.1 语法）→ 旧语法 `listen 443 ssl http2;`
#   2. `ssl_protocols` 去掉 TLSv1.3（el7 OpenSSL 1.0.2k 不支持）
#   3. 默认 HTTP-only 直接上线（80 端口跑全量服务）；HTTPS 整块以注释保留，
#      签好证书后：注释掉「HTTP 直跑」整块 → 取消「HTTPS」两块注释 → nginx -t && reload
#
# 用法：
#   cp nginx-centos7.conf /etc/nginx/conf.d/blog.conf   # 或 sites-available 软链
#   把 server_name _ 换成你的域名（用 IP 访问可保留 _）
#
# 流量分工（与主配置一致）：
#   /api/*、/post/* → 反代 Go :8080；/uploads → Nginx 直出禁执行；其余 → dist SPA fallback

# ========== HTTP 直跑（默认启用；启用 HTTPS 后整块注释掉） ==========
server {
    listen 80;
    server_name _;

    # 上传接口 5MB 上限 + 表单开销（后端同样校验，双保险）
    client_max_body_size 6m;

    # ---------- 安全响应头（HTTP 阶段不发 HSTS，上了 HTTPS 再加） ----------
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;

    # ---------- gzip ----------
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /var/www/blog/dist;
    index index.html;

    # ---------- API 与 SEO 注入页：反代 Go ----------
    location /api/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
    location /post/ {
        proxy_pass         http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # ---------- 用户上传：直出 + 禁执行 ----------
    # nginx 规定 location 内一旦出现自己的 add_header，server 级安全头即不再继承，
    # 因此下面凡带 Cache-Control 的 location 都重复声明了安全头。
    location ^~ /uploads/ {
        alias /var/www/blog/uploads/;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=604800";
        location ~* ^/uploads/.*\.(php|phtml|phar|pl|py|cgi|sh|asp|aspx|jsp)$ {
            deny all;
        }
    }

    # ---------- 前端静态资源 ----------
    location /assets/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
    location = /index.html {
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options        "SAMEORIGIN" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
        add_header Cache-Control "no-cache";
    }
    # SPA history 路由 fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    access_log /var/log/nginx/blog.access.log;
    error_log  /var/log/nginx/blog.error.log;
}

